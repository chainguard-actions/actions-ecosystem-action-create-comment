name: Test explicit nonexistent repo fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          body: "This should never be posted"
          repo: actionchain-harness-nonexistent-owner-x9z/nonexistent-repo-x9z
          number: "1"
      - name: Assert action failed for a nonexistent repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent repo"
            exit 1
          fi
          echo "PASS"
