name: Test custom repo input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          body: "Test comment with custom repo input."
          repo: "actions-ecosystem/action-create-comment"
          number: "1"
      - name: Assert action ran (succeeded or failed gracefully on non-accessible repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (comment created)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (repo not accessible with harness token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
